name: Release AAB (Google Play)
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (increase for every Play upload)'
        required: true
        default: '1'
      version_name:
        description: 'Version name shown to users'
        required: true
        default: '9.0.0'
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - name: Capacitor 8 (Android API 36 – required by Google Play)
        run: npm install --no-audit --no-fund @capacitor/core@^8 @capacitor/android@^8 @capacitor/cli@^8 @capacitor/app@^8 @capacitor/filesystem@^8 @capacitor/share@^8 @capacitor-community/file-opener@^8
      - run: npx cap add android
      - run: rm -rf android/app/src/main/res/mipmap-anydpi-v26 && cp -r icons/* android/app/src/main/res/
      - run: node scripts/android-release.js "${{ inputs.version_code }}" "${{ inputs.version_name }}"
      - run: npx cap sync android
      - name: Restore upload key from GitHub secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
      - name: Build signed app bundle
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SunFlow-ERP-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
